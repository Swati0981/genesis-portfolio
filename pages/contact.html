<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis | Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="logo">Genesis</div>
    <nav>
        <ul>
            <li><a href="../index.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    <section class="contact-hero">
        <div class="contact-text">
            <h1>Full set of great <br>features to make your product fresh</h1>
            <p>Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
        </div>
        
        <div class="contact-form-wrapper">
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="1"></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </section>

    <section class="map-section">
        <img src="images/Map.png" alt="Office Location Map" class="full-width-map">
    </section>
</main>

<footer class="footer">
    <div class="logo">Genesis</div>
    <div class="footer-right">
        <nav class="footer-nav">
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="socials">
            <a href="#" aria-label="Behance">🏀</a>
            <a href="#" aria-label="Instagram">📸</a>
            <a href="#" aria-label="Twitter">🐦</a>
        </div>
    </div>
</footer>

</body>
</html>
