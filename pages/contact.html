<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis | Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="logo">Genesis</div>
  <nav>
    <a href="index.html">Projects</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="container contact-container">
  <div class="contact-form">
    <h1>Full set of great features to make your product fresh</h1>
    <p>Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
    
    <form>
      <div class="form-group">
        <label>Name</label>
        <input type="text" placeholder="Your Name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Email Address">
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea placeholder="How can we help?" rows="4"></textarea>
      </div>
      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>
  
  <div class="map-area">
    <img src="images/Map.png" alt="Location Map">
  </div>
</main>

<footer class="footer">
  <div class="logo">Genesis</div>
  <div class="footer-links">
    <a href="index.html">Projects</a>
    <a href="contact.html">Contact</a>
    <div class="socials">
      <a href="#">Be</a>
      <a href="#">In</a>
      <a href="#">Tw</a>
    </div>
  </div>
</footer>

</body>
</html>
